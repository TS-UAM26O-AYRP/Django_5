services:
  db:
    image: postgres:15-alpine
    container_name: api-rest-postgres
    environment:
      POSTGRES_DB: gestion_usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
